<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Legendary Age</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            position: relative;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        button {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(231,76,60,0.5);
        }
        button:active { transform: scale(0.95); }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 200;
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 15px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-panel">
            <div>HP: <span id="hp">-</span>/100</div>
            <div>Уровень: <span id="level">-</span></div>
            <div>Опыт: <span id="xp">-</span>%</div>
        </div>
        <div class="controls">
            <button id="skill1">1</button>
            <button id="skill2">2</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div id="loadingText">⏳ Подключение...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        let socket;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function connectToServer() {
            const serverUrl = prompt('Адрес сервера:', 'wss://legendary-age-full-version.onrender.com');
            if (!serverUrl) return;

            try {
                socket = new WebSocket(serverUrl);
                
                socket.onopen = () => {
                    loading.style.display = 'none';
                    socket.send(JSON.stringify({ t: 'me' }));
                    console.log('✅ Подключено');
                };

                socket.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.t === 'welcome' && msg.you) {
                        document.getElementById('hp').textContent = msg.you.hp;
                        document.getElementById('level').textContent = msg.you.lvl;
                    }
                };

                socket.onerror = () => {
                    document.getElementById('loadingText').textContent = '❌ Ошибка подключения';
                };
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        function draw() {
            // Фон
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Сетка
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Персонаж
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('Герой', canvas.width/2, canvas.height/2 - 35);

            requestAnimationFrame(draw);
        }

        document.getElementById('skill1').addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ t: 'input', a: 's1' }));
            }
        });

        document.getElementById('skill2').addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ t: 'input', a: 's2' }));
            }
        });

        connectToServer();
        draw();
    </script>
</body>
</html>
