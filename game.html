<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Age</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #canvas { display: block; }
        .ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            width: 60px;
            height: 60px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <div>HP: <span id="hp">100</span>/100</div>
        <div>Уровень: <span id="level">1</span></div>
    </div>
    <div class="controls">
        <button id="skill1">1</button>
        <button id="skill2">2</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let socket;
        const host = prompt('Введи адрес сервера:', 'wss://legendary-age-full-version.onrender.com');
        
        if (host) {
            socket = new WebSocket(host);
            
            socket.onopen = () => {
                socket.send(JSON.stringify({ t: 'me' }));
            };
            
            socket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.t === 'welcome') {
                    document.getElementById('hp').textContent = msg.you.hp;
                    document.getElementById('level').textContent = msg.you.lvl;
                }
            };
        }
        
        function draw() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('Персонаж', canvas.width/2, canvas.height/2 - 30);
            
            requestAnimationFrame(draw);
        }
        
        document.getElementById('skill1').addEventListener('click', () => {
            if (socket) socket.send(JSON.stringify({ t: 'input', a: 's1' }));
        });
        
        document.getElementById('skill2').addEventListener('click', () => {
            if (socket) socket.send(JSON.stringify({ t: 'input', a: 's2' }));
        });
        
        draw();
    </script>
</body>
</html>
